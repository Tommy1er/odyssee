<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Explorer — téléphone</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070d16;color:#edf3f7;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.4}
a{color:#8ee2cc}a:hover{color:#bff0e2}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:#111f2cf2;border:1px solid #2b3f4e;border-radius:8px;padding:10px 12px;font-size:14px;min-height:44px}
.btn.primary{background:#8ee2cc;color:#07141b;border-color:#8ee2cc;font-weight:600}
.btn.on{background:#1b3a35;border-color:#4f8f80;color:#bff0e2}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500}
.chip.model{background:#1b2a3d;color:#9fcbf6}.chip.recon{background:#2a2630;color:#d7c8f3}
.label{font-size:12px;color:#a7bbcb;letter-spacing:.06em;text-transform:uppercase}
</style>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:radial-gradient(ellipse 40% 22% at 50% 44%,#4a3b63 0%,#1b1626 40%,transparent 72%),#03070d">
<div aria-hidden="true" style="position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 78% 22%,#dfe9ff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 34% 72%,#ffe7c2 60%,transparent 61%),radial-gradient(1px 1px at 88% 66%,#fff 60%,transparent 61%),radial-gradient(1px 1px at 62% 88%,#cfe0ff 60%,transparent 61%),radial-gradient(1px 1px at 8% 50%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 70% 36%,#fff 60%,transparent 61%)"></div>

<!-- Barre haute : espaces + recherche -->
<header style="position:absolute;top:0;left:0;right:0;padding:12px 12px 0;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:8px">
<nav aria-label="Espaces" style="display:flex;gap:3px;background:#0f1b27e6;border:1px solid #233442;border-radius:10px;padding:3px;flex:1">
<button class="btn on" style="flex:1;min-height:38px;padding:6px 8px;border-radius:7px;font-size:13px">Explorer</button>
<a href="Observatoire-mobile.html" class="btn" style="flex:1;min-height:38px;padding:6px 8px;border:0;background:transparent;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Observatoire</a>
<a href="Carte-mobile.html" class="btn" style="flex:1;min-height:38px;padding:6px 8px;border:0;background:transparent;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Carte</a>
</nav>
<button class="btn" style="width:44px;padding:0;background:#0f1b27e6" aria-label="Rechercher un objet"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#edf3f7" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</div>
<div class="mono" style="font-size:12px;color:#d6e2ea;display:flex;justify-content:space-between"><span><span style="color:#8ee2cc">●</span> TRAJET · M87 · 1 g</span><span style="color:#a7bbcb">Relativiste · Doppler</span></div>
</header>

<!-- Réticule -->
<div aria-hidden="true" style="position:absolute;left:50%;top:44%;width:34px;height:34px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid #8ee2cc99"></div>
<div class="mono" style="position:absolute;left:50%;top:calc(44% + 30px);transform:translateX(-50%);background:#07141bd9;border:1px solid #2b3f4e;border-radius:6px;padding:6px 9px;font-size:12px;text-align:center">M87 · Virgo A<br><span style="color:#a7bbcb">31,2 Mal restants</span></div>

<!-- Actions de vue (droite) -->
<div style="position:absolute;right:12px;top:118px;display:flex;flex-direction:column;gap:8px">
<button class="btn" style="width:44px;padding:0" aria-label="Qu'est-ce que je regarde ?">?</button>
<button class="btn" style="width:44px;padding:0" aria-label="Vue dégagée">⤢</button>
<button class="btn" style="width:44px;padding:0" aria-label="Destinations">☰</button>
</div>

<!-- Télémétrie essentielle : bande HUD -->
<section aria-label="Télémétrie" style="position:absolute;left:12px;right:12px;bottom:176px;background:#081620e6;border:1px solid #2b3f4e;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px">
<div><span class="label">Vitesse</span><div class="mono" style="font-size:22px;line-height:1.1">0,9831 <span style="font-size:12px;color:#a7bbcb">c</span></div></div>
<div><span class="label">Restant</span><div class="mono" style="font-size:22px;line-height:1.1">31,2 <span style="font-size:12px;color:#a7bbcb">Mal</span></div></div>
<div class="mono" style="font-size:12px;color:#a7bbcb">γ 5,44 · poussée +1 g</div>
<div class="mono" style="font-size:12px;color:#a7bbcb">bord 8 a 114 j · réf. 22,8 Mans</div>
<div style="grid-column:1/-1;height:4px;background:#1f2f3c;border-radius:2px;overflow:hidden"><div style="width:42%;height:100%;background:#8ee2cc"></div></div>
</section>

<!-- Commandes : deux rangées de cibles tactiles -->
<footer style="position:absolute;left:0;right:0;bottom:0;padding:10px 12px 14px;background:linear-gradient(transparent,#070d16 30%);display:flex;flex-direction:column;gap:8px">
<div style="display:flex;gap:8px">
<button class="btn on" style="flex:1">↑ Poussée</button><button class="btn" style="flex:1">Inertie</button><button class="btn" style="flex:1">↓ Freiner</button>
</div>
<div style="display:flex;gap:8px;align-items:center">
<button class="btn" style="width:48px;padding:0" aria-label="Pause">❚❚</button>
<select aria-label="Vitesse de lecture" style="flex:1;font:inherit;font-size:14px;background:#111f2cf2;color:#edf3f7;border:1px solid #2b3f4e;border-radius:8px;padding:0 10px;min-height:44px"><option>1 an / seconde</option></select>
<button class="btn" style="flex:1">Plus ▾</button>
</div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:2px"><span class="chip model">Modèle calculé</span><span class="chip recon">Reconstitution · M87</span></div>
</footer>
</div>
</body>
</html>
