<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Explorer V3.2 — vue extérieure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#03070d;color:#edf3f7;font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.4}
a{color:#8ee2cc;text-decoration:none}
button,select{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.stage{position:relative;overflow:hidden;background:#03070d}
.sky{position:absolute;inset:0;background-repeat:no-repeat;background-color:#03070d}
.vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#03070dcc,transparent 18%,transparent 70%,#03070de6)}
.glass{background:#07101bd1;border:1px solid #a7bbcb2e;border-radius:10px}
.glass.solid{background:#0a1420f5}
.pill{display:flex;gap:2px;padding:3px;border-radius:999px;background:#07101bb8;border:1px solid #a7bbcb2e}
.pill>*{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:12px;color:#c9d7e1;display:inline-flex;align-items:center;gap:6px}
.pill>.on{background:#1b3a35;color:#bff0e2}
.btn{background:#111f2ce6;border:1px solid #2b3f4e;border-radius:7px;padding:7px 11px;font-size:12px;min-height:32px;display:inline-flex;align-items:center;gap:6px;color:#edf3f7}
.btn.primary{background:#8ee2cc;border-color:#8ee2cc;color:#07141b;font-weight:600}
.btn.on{background:#1b3a35;border-color:#4f8f80;color:#bff0e2}
.btn.ghost{background:transparent;border-color:#a7bbcb33}
.kbd{font-family:"JetBrains Mono",monospace;font-size:12px;color:#a7bbcb;border:1px solid #a7bbcb55;border-radius:4px;padding:0 5px;line-height:17px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.obs{background:#17322ad9;color:#9fe8cf}.chip.model{background:#1b2a3dd9;color:#9fcbf6}.chip.recon{background:#2a2630d9;color:#d7c8f3}.chip.fiction{background:#2d2440d9;color:#cdb8f3}
.label{font-size:12px;color:#a7bbcb;letter-spacing:.07em;text-transform:uppercase}
.k{color:#a7bbcb;font-size:12px}
.v{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:15px}
.v small{font-size:12px;color:#a7bbcb}
.tab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:#c9d7e1;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid #2b3f4e;border-radius:8px;overflow:hidden}
.seg>*{border:0;background:#111f2ce6;padding:7px 11px;font-size:12px;min-height:32px;color:#edf3f7}
.seg>*+*{border-left:1px solid #2b3f4e}
.seg>.on{background:#1b3a35;color:#bff0e2}
.bracket{position:absolute;pointer-events:none;--c:#8ee2cc;background:linear-gradient(var(--c),var(--c)) 0 0/18px 1.5px,linear-gradient(var(--c),var(--c)) 0 0/1.5px 18px,linear-gradient(var(--c),var(--c)) 100% 0/18px 1.5px,linear-gradient(var(--c),var(--c)) 100% 0/1.5px 18px,linear-gradient(var(--c),var(--c)) 0 100%/18px 1.5px,linear-gradient(var(--c),var(--c)) 0 100%/1.5px 18px,linear-gradient(var(--c),var(--c)) 100% 100%/18px 1.5px,linear-gradient(var(--c),var(--c)) 100% 100%/1.5px 18px;background-repeat:no-repeat}
dl.grid{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0}
dl.grid dt{color:#a7bbcb;font-size:12px}dl.grid dd{margin:0;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:6px 5px;border-bottom:1px solid #1f2f3c;text-align:left;vertical-align:middle}th{color:#a7bbcb;font-weight:500}
td.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.note{position:absolute;font-size:12px;color:#f0b56b;background:#20170bcc;border:1px dashed #f0b56b88;border-radius:6px;padding:4px 8px}

.bar{position:absolute;display:flex;gap:6px;align-items:center}
.grp{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px;border-radius:12px;background:#07101bd1;border:1px solid #a7bbcb2e}
.grp .btn,.grp .seg>*{min-height:34px}
.tele{display:flex;align-items:center;gap:11px;height:34px;padding:0 12px;border-radius:999px;background:#07101bd1;border:1px solid #a7bbcb2e;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.tele b{font-family:Inter,sans-serif;font-weight:600;font-size:13px}
.tele .u{color:#a7bbcb}
.alert{border-left:3px solid #f0b56b}
</style>
</head>
<body>

<div class="bar" style="left:50%;bottom:10px;transform:translateX(-50%)"><div class="grp"><div class="seg"><button class="on" style="white-space:nowrap">↑ Poussée</button><button class="" style="white-space:nowrap">Inertie</button><button class="" style="white-space:nowrap">↓ Freiner</button></div></div></div>
<div class="bar" style="right:12px;bottom:10px"><div class="grp"><span class="k" style="padding-left:4px">Vue <span class="kbd">V</span></span><div class="seg"><button class="">Cockpit</button><button class="on">Vaisseau</button></div><button class="btn ghost" aria-label="Cinéma">⤢ <span class="kbd">C</span></button></div></div>
</div>
</body>
