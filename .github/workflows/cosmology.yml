name: Independent FLRW photon observatory
on:
  push:
    branches: [main]
    paths: ['src/flrw.js', 'src/cosmology.js', 'public/cosmology.*', 'scripts/validate-photon-path.mjs', 'scripts/validate-cosmology-ui.cjs', 'build.mjs', '.github/workflows/cosmology.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-flrw.mjs && node scripts/validate-photon-path.mjs && node scripts/validate-physics.mjs && node scripts/validate-navigation.mjs
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/validate-cosmology-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmology-observatory
          path: validation/v2-screenshots/cosmology*
