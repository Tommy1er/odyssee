name: High gamma GPU boundaries
on:
  push:
    branches: [main]
    paths:
      - 'src/cloud-pass.js'
      - 'src/observer-projection.js'
      - 'src/sky-optics.js'
      - 'src/group-pass.js'
      - 'scripts/validate-observer-projection-gpu.cjs'
      - 'src/physics.js'
      - 'scripts/validate-high-gamma.mjs'
      - 'scripts/validate-high-gamma-gpu.cjs'
      - '.github/workflows/high-gamma.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-high-gamma.mjs
      - run: npm run test:ui:install:ci
      - run: node scripts/validate-high-gamma-gpu.cjs
      - run: node scripts/validate-observer-projection-gpu.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: high-gamma-gpu
          path: |
            validation/v2-screenshots/high-gamma*.json
            validation/v2-screenshots/observer-projection*.json
