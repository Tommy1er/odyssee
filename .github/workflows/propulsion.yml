name: Independent relativistic rocket benchmarks
on:
  push:
    branches: [main]
    paths: ['src/rocket-bench.js', 'src/rocket-lcdm.js', 'src/propulsion.js', 'src/flrw.js', 'public/propulsion.*', 'public/cosmology.css', 'scripts/validate-rocket-bench.mjs', 'scripts/validate-rocket-lcdm.mjs', 'scripts/validate-propulsion-ui.cjs', 'build.mjs', '.github/workflows/propulsion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-rocket-bench.mjs && node scripts/validate-rocket-lcdm.mjs && node scripts/validate-photon-path.mjs && node scripts/validate-physics.mjs && node scripts/validate-navigation.mjs
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/validate-propulsion-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: propulsion-benchmark
          path: validation/v2-screenshots/propulsion*
