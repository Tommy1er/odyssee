name: Observer precision numerical isolation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-observer-precision.mjs'
      - '.github/workflows/observer-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-observer-precision.mjs --write
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-precision-isolation
          path: validation/reports/observer-precision-isolation-2026-11-17.json
