name: Fast Odyssée source validation and public bundle build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/galaxy-build.yml'
      - 'src/galaxy-spectral.js'
      - 'src/galaxy-photometry.js'
      - 'src/galaxy-observer-spectrum.js'
      - 'src/galaxy-spectral-overlay.js'
      - 'src/sky-optics.js'
      - 'src/renderer.js'
      - 'src/galaxy-sed-kc96-data.js'
      - 'src/local-group.js'
      - 'src/flrw.js'
      - 'src/extragalactic-nebulae.js'
      - 'src/nebulae.js'
      - 'src/nested-emission.js'
      - 'src/nebula-points.js'
      - 'src/environments.js'
      - 'src/photometry.js'
      - 'src/stellar-light.js'
      - 'scripts/validate-nebula-points.mjs'
      - 'src/emission-budget.js'
      - 'scripts/validate-nested-emission.mjs'
      - 'src/cockpit.js'
      - 'src/gpu-startup.js'
      - 'src/cloud-pass.js'
      - 'src/group-pass.js'
      - 'src/sky-refresh.js'
      - 'src/render-performance.js'
      - 'src/scene-timings.js'
      - 'src/render-diagnostics.js'
      - 'src/render-budget.js'
      - 'src/galaxy.js'
      - 'src/spacecraft.js'
      - 'src/cf4-basins.js'
      - 'scripts/validate-flrw.mjs'
      - 'scripts/validate-star-nurseries.mjs'
      - 'scripts/validate-galaxy-spectra.mjs'
      - 'scripts/validate-galaxy-observer-spectrum.mjs'
      - 'scripts/validate-galaxy-spectral-overlay.mjs'
      - 'scripts/validate-nebulae.mjs'
      - 'data/galaxy-spectra-kc96/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssee-fast-public-build
  cancel-in-progress: false
jobs:
  check-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scientific numeric regressions
        run: |
          node scripts/validate-nested-emission.mjs
          node scripts/validate-nebula-points.mjs
          node scripts/validate-flrw.mjs
          node scripts/validate-star-nurseries.mjs
          node scripts/validate-nebulae.mjs
          node scripts/validate-galaxy-spectra.mjs
          node scripts/validate-galaxy-observer-spectrum.mjs
          node scripts/validate-galaxy-spectral-overlay.mjs
          node scripts/validate-galaxy-photometry.mjs
          node scripts/validate-cf4-basins.mjs
      - name: Compile public WebGL bundles
        run: npm run build
      - name: Commit generated source bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cockpit.js public/cosmos.js
          if ! git diff --cached --quiet; then
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
              echo "main advanced; skip committing bundles built from an older revision"
              exit 0
            fi
            git commit -m "Build: nurseries LMC/M33, cosmologie FLRW et ciel public"
            git push origin HEAD:main
          fi
