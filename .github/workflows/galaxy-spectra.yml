name: Galaxy spectra build and verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/galaxy-spectra.yml'
      - 'public/cockpit.css'
      - 'public/cockpit.html'
      - 'src/galaxy-spectral.js'
      - 'src/galaxy-sed-kc96-data.js'
      - 'src/galaxy-photometry.js'
      - 'src/galaxy-observer-spectrum.js'
      - 'src/galaxy-spectral-overlay.js'
      - 'src/sky-optics.js'
      - 'src/renderer.js'
      - 'src/cockpit.js'
      - 'src/flrw.js'
      - 'src/extragalactic-nebulae.js'
      - 'src/nebulae.js'
      - 'src/nested-emission.js'
      - 'src/emission-budget.js'
      - 'scripts/validate-nested-emission.mjs'
      - 'scripts/validate-nested-emission-ui.cjs'
      - 'src/local-group.js'
      - 'src/cf4-basins.js'
      - 'scripts/validate-galaxy-spectra.mjs'
      - 'scripts/validate-galaxy-photometry.mjs'
      - 'scripts/validate-galaxy-observer-spectrum.mjs'
      - 'scripts/validate-galaxy-spectral-overlay.mjs'
      - 'scripts/validate-flrw.mjs'
      - 'scripts/validate-star-nurseries.mjs'
      - 'scripts/validate-star-nurseries-ui.cjs'
      - 'scripts/validate-galaxy-ui.cjs'
      - 'scripts/validate-galaxy-spectral-overlay-ui.cjs'
      - 'scripts/build-galaxy-sed-kc96.mjs'
      - 'data/galaxy-spectra-kc96/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galaxy-browser-validation
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate archive and generated SED
        run: node scripts/build-galaxy-sed-kc96.mjs
      - name: Check spectral colours and magnitudes
        run: |
          node scripts/validate-galaxy-spectra.mjs
          node scripts/validate-galaxy-observer-spectrum.mjs
          node scripts/validate-galaxy-spectral-overlay.mjs
          node scripts/validate-galaxy-photometry.mjs
          node scripts/validate-cf4-basins.mjs
          node scripts/validate-nested-emission.mjs
          node scripts/validate-flrw.mjs
          node scripts/validate-nebulae.mjs
          node scripts/validate-star-nurseries.mjs
      - name: Rebuild public JavaScript before browser validation
        run: npm run build
      - name: Install headless Chromium for real WebGL integration tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate cockpit and reconstructed basins in a browser
        run: |
          node scripts/validate-nested-emission-ui.cjs
          node scripts/validate-galaxy-ui.cjs
          node scripts/validate-basins-ui.cjs
          node scripts/validate-star-nurseries-ui.cjs
          node scripts/validate-galaxy-spectral-overlay-ui.cjs
      - name: Keep SwiftShader captures for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-nurseries-swiftshader
          path: |
            validation/v2-screenshots/nurserie-*.png
            validation/v2-screenshots/nurseries-ui-results.json
            validation/v2-screenshots/nested-emission-*.png
            validation/v2-screenshots/nested-emission-ui-results.json
            validation/v2-screenshots/galaxy-spectral-hdr-*.png
            validation/v2-screenshots/galaxy-spectral-hdr-ui-results.json
          if-no-files-found: ignore
